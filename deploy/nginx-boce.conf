# web-tools nginx 片段 —— include 到站点的 server 块内
#
# 静态页已经打进镜像、由 Node 直接托管，宿主机不放任何前端文件，
# 所以这里只要一层整站反代，不用再区分「静态走 nginx / 接口走后端」。
# （旧方案把静态 rsync 到宿主机目录再由 nginx 出，会撞目录权限问题，已废弃。）
#
# 两个部署环境的差异，接入时按需调整：
#   zzw（公网，经 ssl.conf 443 → 本机 80 两跳）
#     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;   ← 保留
#   内网（Jenkins 部署，nginx 单跳）
#     proxy_set_header X-Forwarded-Proto $scheme;                   ← 改这一行
#   后端端口：公网 8899，内网 56091（改流水线 port 参数时这里要同步改）

# 让重定向返回相对地址，避免被内层 http 带成 http://
absolute_redirect off;

location / {
    proxy_pass http://127.0.0.1:56091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 后端按它判断 cookie 是否加 Secure，也用于按真实 IP 限流
    proxy_set_header X-Forwarded-Proto $scheme;

    # 单次拨测最长 150s（含 WebSocket 收流兜底），留足余量
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 2m;
}
