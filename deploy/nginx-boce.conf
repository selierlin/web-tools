# 拨测工具 nginx 片段 —— include 到站点的 server 块内
# 必须放在该 server 块的最前面：里面的正则 location 要先于通用的
# 「静态资源 30d 缓存」规则匹配，否则 /server/ 源码目录挡不住。
#
# 两个部署环境的差异，接入时按需调整：
#   zzw（公网，经 ssl.conf 443 → 本机 80 两跳）
#     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;   ← 保留
#   内网（Jenkins 部署，nginx 单跳）
#     proxy_set_header X-Forwarded-Proto $scheme;                   ← 改这一行
#   站点根：公网 /usr/Projects/web-tools，内网 /opt/webapps/web-tools/fe

# 让重定向返回相对地址，避免被内层 http 带成 http://
absolute_redirect off;

# 1) 禁止访问服务端源码（同步到了站点根下）
location ~ ^/(server|node_modules|\.git)/ {
    return 404;
}

# 2) 拨测页面：纯静态，由 nginx 直接出
location = /boce {
    return 301 /boce/;
}

location /boce/ {
    try_files $uri $uri/ =404;
}

# 3) 拨测接口：反代到本机 Node（^~ 避免被静态正则抢走）
location ^~ /boce/api/ {
    proxy_pass http://127.0.0.1:8899/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 拨测任务最长 150s（含 WebSocket 收流兜底），留足余量
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 2m;
}
