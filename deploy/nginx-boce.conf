# 拨测工具 nginx 片段 —— 由 qr.conf 的 server 块 include
# 必须放在该 server 块的最前面：里面的正则 location 要先于通用的
# 「静态资源 30d 缓存」规则匹配，否则 /server/ 源码目录挡不住。
#
# 依赖 ssl.conf 里 qr.linliang.top 的 443 块向本机 80 传递
#   X-Forwarded-Proto / X-Forwarded-For
# 否则后端拿不到真实来源 IP，口令限流会变成全局共享计数。

# 让重定向返回相对地址，避免被内层 http 带成 http://
absolute_redirect off;

# 1) 禁止访问服务端源码（同步到了站点根下）
location ~ ^/(server|node_modules|\.git)/ {
    return 404;
}

# 2) 拨测页面：纯静态，由 nginx 直接出
location = /boce {
    return 301 /boce/;
}

location /boce/ {
    try_files $uri $uri/ =404;
}

# 3) 拨测接口：反代到本机 Node（^~ 避免被静态正则抢走）
location ^~ /boce/api/ {
    proxy_pass http://127.0.0.1:8899/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 拨测任务最长 150s（含 WebSocket 收流兜底），留足余量
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 2m;
}
