<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日期计算器</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.15);
            --text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 450px; }

        h1 {
            text-align: center; font-size: 1.6rem; margin: 20px 0 30px;
            letter-spacing: 2px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 0.9rem; color: #94a3b8; margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        /* 智能输入框 */
        .smart-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            min-width: 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .smart-input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .smart-input-wrapper input[type="text"] {
            flex: 1; padding: 14px 16px; background: transparent;
            border: none; color: white; font-size: 1.1rem; outline: none;
            width: 100%; min-width: 0;
        }

        /* 日历图标区域 */
        .calendar-btn {
            width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #94a3b8; border-left: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .calendar-btn:active { background: rgba(255,255,255,0.1); color: var(--primary); }

        /* 真正隐藏的日期控件 */
        .hidden-date-input {
            position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;
        }

        /* 结果区 */
        .result-group {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px; padding: 15px; margin-top: 15px;
        }

        .res-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; min-height: 26px; }
        .res-row:last-child { margin-bottom: 0; }
        .res-label { font-size: 0.85rem; color: #94a3b8; flex-shrink: 0; }
        .res-value { font-weight: 600; color: #fff; font-size: 1.1rem; text-align: right; min-width: 0; white-space: nowrap; }
        .highlight { color: #f472b6; text-shadow: 0 0 10px rgba(244,114,182,0.3); }

        .offset-input {
            width: 100%; min-width: 0; padding: 12px 4px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: 12px;
            color: #fff; text-align: center; font-size: 1.1rem; outline: none;
        }

        .offset-input:focus { border-color: var(--primary); }

        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; min-width: 0; }
        .offset-field { min-width: 0; }
        .offset-field label {
            display: block; font-size: 0.72rem; color: #94a3b8;
            text-align: center; margin-bottom: 6px;
        }
        small { color: #64748b; font-size: 0.75rem; display: block; margin-top: 5px; }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,0.5); }

    </style>
</head>
<body>

<div class="container">
    <h1>DATE CALCULATOR</h1>

    <div class="card">
        <div class="section-title">📅 日期推算 (加/减天、时、分、秒)</div>
        <div class="smart-input-wrapper">
            <input type="text" id="baseDate" placeholder="输入 20251231103000" maxlength="19">
            <!-- 点击这个 div 触发隐藏的 input -->
            <div class="calendar-btn" onclick="openPicker('basePicker')">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
            </div>
            <input type="datetime-local" id="basePicker" class="hidden-date-input" onchange="onPickerChange(this, 'baseDate')">
        </div>

        <div class="grid-4">
            <div class="offset-field">
                <label>天</label>
                <input type="number" id="offsetDay" class="offset-input" value="7">
            </div>
            <div class="offset-field">
                <label>时</label>
                <input type="number" id="offsetHour" class="offset-input" value="0">
            </div>
            <div class="offset-field">
                <label>分</label>
                <input type="number" id="offsetMinute" class="offset-input" value="0">
            </div>
            <div class="offset-field">
                <label>秒</label>
                <input type="number" id="offsetSecond" class="offset-input" value="0">
            </div>
        </div>
        <small>* 均支持负数，如 -60 天代表向前推算；只输入 8 位日期时按 00:00:00 处理</small>

        <div class="result-group">
            <div class="res-row">
                <span class="res-label">目标时间</span>
                <span class="res-value highlight" id="targetDate">-</span>
            </div>
            <div class="res-row">
                <span class="res-label">星期几</span>
                <span class="res-value" id="targetWeek">-</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">📏 日期间隔计算</div>
        <div class="smart-input-wrapper">
            <input type="text" id="dateA" placeholder="时间 A" maxlength="19">
            <div class="calendar-btn" onclick="openPicker('pickerA')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <input type="datetime-local" id="pickerA" class="hidden-date-input" onchange="onPickerChange(this, 'dateA')">
        </div>
        <div class="smart-input-wrapper">
            <input type="text" id="dateB" placeholder="时间 B" maxlength="19">
            <div class="calendar-btn" onclick="openPicker('pickerB')">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            </div>
            <input type="datetime-local" id="pickerB" class="hidden-date-input" onchange="onPickerChange(this, 'dateB')">
        </div>
        <small>* 可只填日期(YYYYMMDD)或精确到秒(YYYYMMDDHHmmss)；正数表示 B 晚于 A</small>

        <div class="result-group">
            <div class="res-row">
                <span class="res-label">精确相差</span>
                <span class="res-value highlight" id="diffExact">-</span>
            </div>
            <div class="res-row">
                <span class="res-label">相差天数</span>
                <span class="res-value" id="diffDays">-</span>
            </div>
            <div class="res-row">
                <span class="res-label">相差小时</span>
                <span class="res-value" id="diffHours">-</span>
            </div>
            <div class="res-row">
                <span class="res-label">总分钟数</span>
                <span class="res-value" id="diffMinutes">-</span>
            </div>
            <div class="res-row">
                <span class="res-label">总秒数</span>
                <span class="res-value" id="diffSeconds">-</span>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 弹出日历的核心方法
    function openPicker(pickerId) {
        const picker = document.getElementById(pickerId);
        // 使用现代浏览器标准 API 弹出选择器
        if (picker.showPicker) {
            picker.showPicker();
        } else {
            // 兼容旧版浏览器
            picker.click();
        }
    }

    // 2. 日历选定后的回调
    function onPickerChange(picker, textId) {
        if (picker.value) {
            // 将 2025-12-31T10:30 转为 202512311030（datetime-local 不含秒）
            const val = picker.value.replace(/[-T:]/g, '');
            document.getElementById(textId).value = val;
            runCalculations();
        }
    }

    // 3. 初始加载
    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();

        document.getElementById('baseDate').value = formatDateTime(now);
        document.getElementById('dateA').value = formatDateTime(now);
        document.getElementById('dateB').value = "20251231235959";

        // 绑定手动输入的监听
        ['baseDate', 'offsetDay', 'offsetHour', 'offsetMinute', 'offsetSecond', 'dateA', 'dateB'].forEach(id => {
            document.getElementById(id).addEventListener('input', runCalculations);
        });

        runCalculations();
    });

    // 核心计算函数
    function runCalculations() {
        calcOffset();
        calcDiff();
    }

    const pad = (n) => String(n).padStart(2, '0');

    function formatDateTime(date) {
        return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`
            + `${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    function formatDisplay(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} `
            + `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    // 支持 8 位日期、12 位到分、14 位到秒，也容忍 - / . : 空格 T 等分隔符
    function smartParseDateTime(str) {
        if (!str) return null;
        const digits = str.trim().replace(/[-/.\s:T]/g, '');
        if (digits.length !== 8 && digits.length !== 12 && digits.length !== 14) return null;

        const y = parseInt(digits.substring(0, 4), 10);
        const mo = parseInt(digits.substring(4, 6), 10) - 1;
        const d = parseInt(digits.substring(6, 8), 10);
        const h = digits.length >= 12 ? parseInt(digits.substring(8, 10), 10) : 0;
        const mi = digits.length >= 12 ? parseInt(digits.substring(10, 12), 10) : 0;
        const s = digits.length === 14 ? parseInt(digits.substring(12, 14), 10) : 0;

        if (h > 23 || mi > 59 || s > 59) return null;

        const date = new Date(y, mo, d, h, mi, s);
        return (date.getFullYear() === y && date.getMonth() === mo && date.getDate() === d) ? date : null;
    }

    function calcOffset() {
        const base = smartParseDateTime(document.getElementById('baseDate').value);
        const day = parseInt(document.getElementById('offsetDay').value, 10) || 0;
        const hour = parseInt(document.getElementById('offsetHour').value, 10) || 0;
        const minute = parseInt(document.getElementById('offsetMinute').value, 10) || 0;
        const second = parseInt(document.getElementById('offsetSecond').value, 10) || 0;
        const targetEl = document.getElementById('targetDate');
        const weekEl = document.getElementById('targetWeek');

        if (base) {
            const target = new Date(base.getTime());
            target.setDate(target.getDate() + day);
            target.setHours(target.getHours() + hour);
            target.setMinutes(target.getMinutes() + minute);
            target.setSeconds(target.getSeconds() + second);

            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            targetEl.innerText = formatDisplay(target);
            weekEl.innerText = weekDays[target.getDay()];
        } else {
            targetEl.innerText = "格式: YYYYMMDD[HHmmss]";
            weekEl.innerText = "-";
        }
    }

    function calcDiff() {
        const dateA = smartParseDateTime(document.getElementById('dateA').value);
        const dateB = smartParseDateTime(document.getElementById('dateB').value);
        const exactEl = document.getElementById('diffExact');
        const dEl = document.getElementById('diffDays');
        const hEl = document.getElementById('diffHours');
        const mEl = document.getElementById('diffMinutes');
        const sEl = document.getElementById('diffSeconds');

        if (!dateA || !dateB) {
            [exactEl, dEl, hEl, mEl, sEl].forEach(el => el.innerText = "-");
            return;
        }

        const sign = dateB < dateA ? -1 : 1;
        let rest = Math.floor(Math.abs(dateB - dateA) / 1000);

        const days = Math.floor(rest / 86400); rest -= days * 86400;
        const hours = Math.floor(rest / 3600); rest -= hours * 3600;
        const minutes = Math.floor(rest / 60);
        const seconds = rest - minutes * 60;

        // 精确相差：天 + HH:mm:ss，保持单行避免结果区高度跳动
        const hms = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        exactEl.innerText = (sign < 0 ? "-" : "") + (days ? `${days} 天 ` : "") + hms;

        // 避免 -0 这种显示
        const total = (unit) => {
            const v = Math.floor(Math.abs(dateB - dateA) / unit) * sign;
            return (v === 0 ? 0 : v).toLocaleString();
        };

        dEl.innerText = `${total(86400000)} 天`;
        hEl.innerText = `${total(3600000)} 小时`;
        mEl.innerText = `${total(60000)} 分钟`;
        sEl.innerText = `${total(1000)} 秒`;
    }
</script>
<script src="scripts/form-persist.js"></script>
</body>
</html>
