<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本批量加工处理</title>
    <link rel="stylesheet" href="./vendor/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles/workbench.css">
    <link rel="stylesheet" href="styles/text-process.css">
</head>
<body class="text-process">

<main class="container">
    <header class="page-heading">
        <h1>文本加工<span class="title-dot">.</span></h1>
        <p class="page-description">批量拼接、拆分与整理文本</p>
    </header>

    <section class="workspace" aria-label="文本加工工作区">
    <div class="workspace-toolbar">
    <div class="quote-select">
        <span class="section-label">处理选项</span>
        <div class="quote-main">
            <label for="quoteType">引号</label>
            <select id="quoteType">
                <option value="single">单引号 (')</option>
                <option value="double">双引号 (")</option>
            </select>
        </div>
        <div class="inline-options">
            <label class="sort-control"> <span class="control-label">排序</span>
                <select id="sortMode">
                    <option value="none">不排序</option>
                    <option value="asc">升序</option>
                    <option value="desc">降序</option>
                </select>
            </label>
            <label class="check-control"><input type="checkbox" id="dedupeOption"> 去重</label>
        </div>
    </div>

    <div class="format-guide">
        <h2>支持的格式</h2>
        <div class="format-example"><span>多行 → 逗号拼接</span><code>A↵ B↵ C → A,B,C</code></div>
        <div class="format-example"><span>加引号 / 去引号</span><code>'A','B','C'</code></div>
        <p>输入后显示可用操作。悬停预览，点击转换并自动复制。</p>
    </div>
    </div>

    <div class="text-area-group">
        <div class="text-box">
            <label class="panel-label" for="inputText"><span><b>01</b> 原始文本</span><span class="panel-hint">粘贴或输入</span></label>
            <div class="editor-wrapper">
                <div class="line-numbers" id="inputLineNums">1</div>
                <textarea id="inputText" placeholder="请粘贴需要处理的文本..." spellcheck="false"></textarea>
            </div>
            <div class="editor-meta"><strong>输入统计</strong>：<span id="inputStats">1 行 · 0 字</span></div>
        </div>

        <!-- 优化后的回传区域 -->
        <div class="transfer-btn-wrap">
            <button class="transfer-btn" id="transferBtn" title="将结果回传到输入框" aria-label="将结果回传到输入框">
                <i class="fa fa-chevron-left"></i>
            </button>
        </div>

        <div class="text-box result-panel">
            <label class="panel-label" for="outputText"><span><b>02</b> 处理结果</span><span class="panel-hint">只读</span></label>
            <div class="editor-wrapper">
                <div class="line-numbers" id="outputLineNums">1</div>
                <textarea id="outputText" placeholder="处理后的文本会显示在这里" readonly spellcheck="false"></textarea>
            </div>
            <div class="editor-meta"><strong>输出统计</strong>：<span id="outputStats">1 行 · 0 字</span></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="btn1">多行 → 逗号拼接</button>
        <button id="btn2">多行 → 引号逗号</button>
        <button id="btn3">逗号 → 多行</button>
        <button id="btn4">引号 → 无引多行</button>
        <button class="copy-btn" id="copyBtn"><i class="fa fa-clone" aria-hidden="true"></i> 复制结果</button>
    </div>

    <div class="tip" id="tipInfo" role="status" aria-live="polite">温馨提示：输入文本后，自动显示功能按钮</div>
    </section>
</main>
<script>

    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inputLineNums = document.getElementById('inputLineNums');
    const outputLineNums = document.getElementById('outputLineNums');
    const inputStats = document.getElementById('inputStats');
    const outputStats = document.getElementById('outputStats');
    const tipInfo = document.getElementById('tipInfo');
    const transferBtn = document.getElementById('transferBtn');
    const sortMode = document.getElementById('sortMode');
    const dedupeOption = document.getElementById('dedupeOption');
    let currentActionFn = (t) => t;

    let lastInputLines = 0;
    const getStatsText = (text) => {
        const lines = text ? text.split(/\r?\n/).length : 1;
        const chars = text.length;
        return `${lines} 行 · ${chars} 字`;
    };

    const updateStats = () => {
        inputStats.innerText = getStatsText(inputText.value);
        outputStats.innerText = getStatsText(outputText.value);
    };

    const updateLineNumbers = (ta, lineNumDiv) => {
        const lines = ta.value.split('\n').length;
        if (ta === inputText && lines === lastInputLines) return;
        if (ta === inputText) lastInputLines = lines;

        const nums = [];
        for (let i = 1; i <= lines; i++) {
            nums.push(i);
        }
        lineNumDiv.innerText = nums.join('\n');
    };

    const syncScroll = (ta, lineNumDiv) => {
        window.requestAnimationFrame(() => {
            lineNumDiv.scrollTop = ta.scrollTop;
        });
    };

    inputText.addEventListener('input', () => {
        updateLineNumbers(inputText, inputLineNums);
        updateStats();
        judgeInputTypeAndShowButtons();
    });

    inputText.addEventListener('scroll', () => syncScroll(inputText, inputLineNums));
    outputText.addEventListener('scroll', () => syncScroll(outputText, outputLineNums));

    const trimStr = (str) => str.replace(/^\s+|\s+$/g, '');

    // --- 预览功能 ---
    let savedOutputValue = '';
    let savedTipInfo = '';
    let isPreviewing = false;
    const PREVIEW_MAX_LINES = 10;
    const PREVIEW_MAX_CHARS = 500;

    const getPreviewInput = (text) => {
        const lines = text.split(/\r?\n/);
        if (lines.length <= PREVIEW_MAX_LINES && text.length <= PREVIEW_MAX_CHARS) {
            return { preview: text, truncated: false };
        }
        const previewLines = lines.slice(0, PREVIEW_MAX_LINES);
        let preview = previewLines.join('\n');
        if (preview.length > PREVIEW_MAX_CHARS) {
            preview = preview.substring(0, PREVIEW_MAX_CHARS);
        }
        return { preview, truncated: true };
    };

    const getActionFnForBtn = (btnId) => {
        switch(btnId) {
            case 'btn1': return batchProcessText.multiToSingle;
            case 'btn2': {
                const quote = document.getElementById('quoteType').value === 'single' ? "'" : '"';
                return (t) => batchProcessText.multiToSingleWithQuote(t, quote);
            }
            case 'btn3': return batchProcessText.singleToMulti;
            case 'btn4': return batchProcessText.singleQuotedToMultiUnquoted;
            default: return (t) => t;
        }
    };

    const showPreview = (btnId) => {
        const inputVal = trimStr(inputText.value);
        if (!inputVal) return;
        savedOutputValue = outputText.value;
        savedTipInfo = tipInfo.innerText;
        isPreviewing = true;

        const actionFn = getActionFnForBtn(btnId);
        const { preview, truncated } = getPreviewInput(inputText.value);
        const previewResult = applySelectedOptions(actionFn(preview));

        outputText.value = previewResult;
        outputText.closest('.editor-wrapper').classList.add('previewing');
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        tipInfo.innerText = truncated
            ? '⚡ 预览模式 — 仅使用前 10 行数据，点击按钮查看完整结果'
            : '⚡ 预览模式 — 点击按钮执行操作';
    };

    const hidePreview = () => {
        if (!isPreviewing) return;
        isPreviewing = false;
        outputText.value = savedOutputValue;
        outputText.closest('.editor-wrapper').classList.remove('previewing');
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        savedOutputValue = '';
        tipInfo.innerText = savedTipInfo;
    };

    // --- 执行操作 ---
    const copyToClipboard = async (text) => {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (e) {
            // 降级方案
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            } catch (err) {
                document.body.removeChild(textarea);
                return false;
            }
        }
    };

    const processAction = (actionFn = currentActionFn, autoCopy = false) => {
        if (isPreviewing) {
            isPreviewing = false;
            outputText.closest('.editor-wrapper').classList.remove('previewing');
        }
        currentActionFn = actionFn;
        const val = applySelectedOptions(currentActionFn(inputText.value));
        outputText.value = val;
        savedOutputValue = '';
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        outputText.scrollTop = 0;
        outputLineNums.scrollTop = 0;

        // 如果启用自动复制
        if (autoCopy && val) {
            copyToClipboard(val).then(success => {
                if (success) {
                    tipInfo.innerText = '已转换并复制到剪贴板！';
                } else {
                    tipInfo.innerText = '已转换，但自动复制失败';
                }
                setTimeout(() => {
                    tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
                }, 2000);
            });
        }
    };

    const batchProcessText = {
        multiToSingle: (text) => text.split(/\r?\n/).map(trimStr).filter(Boolean).join(','),
        multiToSingleWithQuote: (text, quote) => text.split(/\r?\n/).map(trimStr).filter(Boolean).map(s => `${quote}${s}${quote}`).join(','),
        singleToMulti: (text) => text.split(',').map(trimStr).filter(Boolean).join('\n'),
        singleQuotedToMultiUnquoted: (text) => text.replace(/["']/g, '').split(',').map(trimStr).filter(Boolean).join('\n'),
        sortText: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            return text
                .split(splitter)
                .map(trimStr)
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }))
                .join(hasLineBreak ? '\n' : ',');
        },
        sortTextDesc: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            return text
                .split(splitter)
                .map(trimStr)
                .filter(Boolean)
                .sort((a, b) => b.localeCompare(a, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }))
                .join(hasLineBreak ? '\n' : ',');
        },
        deduplicateText: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            const unique = Array.from(new Set(
                text.split(splitter).map(trimStr).filter(Boolean)
            ));
            return unique.join(hasLineBreak ? '\n' : ',');
        }
    };
    const applySelectedOptions = (text) => {
        let val = text;
        if (dedupeOption.checked) val = batchProcessText.deduplicateText(val);
        if (sortMode.value === 'asc') val = batchProcessText.sortText(val);
        if (sortMode.value === 'desc') val = batchProcessText.sortTextDesc(val);
        return val;
    };

    const judgeInputTypeAndShowButtons = () => {
        const inputVal = trimStr(inputText.value);
        const btns = ['btn1', 'btn2', 'btn3', 'btn4'];
        btns.forEach(id => document.getElementById(id).classList.remove('active'));

        if (!inputVal) {
            tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
            return;
        }

        if (inputVal.includes('\n')) {
            document.getElementById('btn1').classList.add('active');
            document.getElementById('btn2').classList.add('active');
        } else if (inputVal.includes(',')) {
            document.getElementById('btn3').classList.add('active');
            if (inputVal.includes('"') || inputVal.includes("'")) document.getElementById('btn4').classList.add('active');
        } else {
            btns.forEach(id => document.getElementById(id).classList.add('active'));
        }
    };

    document.getElementById('btn1').addEventListener('click', () => processAction(batchProcessText.multiToSingle, true));
    document.getElementById('btn2').addEventListener('click', () => {
        const quote = document.getElementById('quoteType').value === 'single' ? "'" : '"';
        processAction((t) => batchProcessText.multiToSingleWithQuote(t, quote), true);
    });
    document.getElementById('btn3').addEventListener('click', () => processAction(batchProcessText.singleToMulti, true));
    document.getElementById('btn4').addEventListener('click', () => processAction(batchProcessText.singleQuotedToMultiUnquoted, true));

    // 预览事件绑定
    ['btn1', 'btn2', 'btn3', 'btn4'].forEach(id => {
        const btn = document.getElementById(id);
        btn.addEventListener('mouseenter', () => showPreview(id));
        btn.addEventListener('mouseleave', hidePreview);
    });
    sortMode.addEventListener('change', () => processAction());
    dedupeOption.addEventListener('change', () => processAction());

    transferBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        inputText.value = outputText.value;
        updateLineNumbers(inputText, inputLineNums);
        updateStats();
        judgeInputTypeAndShowButtons();
        tipInfo.innerText = '结果已回传';
        // 手机端自动滚回顶部
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
        if (!outputText.value) return;
        const success = await copyToClipboard(outputText.value);
        if (success) {
            tipInfo.innerText = '复制成功！';
            setTimeout(() => {
                // 只有在提示还是"复制成功"时才恢复，避免覆盖其他提示
                if (tipInfo.innerText === '复制成功！') {
                    tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
                }
            }, 2000);
        }
    });

    updateLineNumbers(inputText, inputLineNums);
    updateLineNumbers(outputText, outputLineNums);
    judgeInputTypeAndShowButtons();
    updateStats();
</script>
<script src="scripts/form-persist.js"></script>
</body>
</html>
