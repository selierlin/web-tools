<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本批量加工处理</title>
    <link rel="stylesheet" href="./vendor/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        :root {
            /* 深色基底 */
            --bg-1: #0a1120;
            --bg-2: #15203a;
            --bg-3: #0c1a2b;

            /* 玻璃卡片 */
            --card: rgba(255, 255, 255, 0.055);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-border-strong: rgba(255, 255, 255, 0.22);

            /* 文字 */
            --text-main: #eef4ff;
            --text-soft: #a6b6ce;
            --text-dim: #6f8198;

            /* 主色系 · 青蓝收敛 */
            --primary: #38bdf8;
            --primary-2: #22d3ee;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --primary-soft: rgba(56, 189, 248, 0.14);

            /* 次色 · 蓝紫点缀 */
            --secondary: #818cf8;

            /* 编辑器 */
            --editor-bg: rgba(6, 14, 26, 0.55);
            --line-num-bg: rgba(9, 20, 38, 0.6);

            /* 圆角节奏 */
            --r-lg: 18px;
            --r-md: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        #particles-js {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.18), transparent 34%),
                radial-gradient(circle at 88% 12%, rgba(129, 140, 248, 0.16), transparent 38%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2) 48%, var(--bg-3));
        }

        body {
            padding: 2rem 1.5rem;
            position: relative;
            min-height: 100vh;
            color: var(--text-main);
            font-family: "JetBrains Mono", "SFMono-Regular", ui-monospace, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", monospace;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 2.2rem;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(3, 8, 20, 0.5);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            position: relative;
            z-index: 1;
            animation: reveal 520ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* —— 标题区 —— */
        .page-head {
            text-align: center;
            margin-bottom: 1.8rem;
        }
        h1 {
            font-size: clamp(1.6rem, 3.2vw, 2.3rem);
            letter-spacing: 0.5px;
            font-weight: 700;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
            background: linear-gradient(120deg, #ffffff, #bfe3ff 55%, #8ab8ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-head .sub {
            margin-top: 0.5rem;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
        }

        /* —— 工具栏 —— */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            height: 38px;
            padding: 0 0.95rem;
            border-radius: 999px;
            border: 1px solid var(--card-border);
            background: rgba(10, 22, 42, 0.5);
            color: var(--text-soft);
            font-size: 0.85rem;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .chip .chip-label {
            color: #cfe0f5;
            white-space: nowrap;
            font-size: 0.82rem;
        }
        .chip:hover { border-color: var(--card-border-strong); }
        .chip:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        /* 自定义 select */
        .chip select {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            background: transparent;
            color: #f3f8ff;
            font-size: 0.84rem;
            font-family: inherit;
            padding-right: 1.1rem;
            cursor: pointer;
            outline: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M1 3.2l4 4 4-4' fill='none' stroke='%239fb0c8' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat;
            background-position: right center;
        }
        .chip select option {
            background: #0f1a2e;
            color: #eef4ff;
        }

        /* 去重 checkbox */
        .chip.check {
            cursor: pointer;
            user-select: none;
        }
        .chip.check input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1.5px solid var(--card-border-strong);
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            display: inline-grid;
            place-content: center;
            transition: background .15s ease, border-color .15s ease;
            margin: 0;
        }
        .chip.check input[type="checkbox"]::before {
            content: "";
            width: 9px;
            height: 9px;
            transform: scale(0);
            transition: transform .15s ease-in-out;
            background: #fff;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0, 43% 62%);
        }
        .chip.check input[type="checkbox"]:checked {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            border-color: transparent;
        }
        .chip.check input[type="checkbox"]:checked::before {
            transform: scale(1);
        }
        .chip.check:has(input:checked) {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .chip.check:has(input:checked) .chip-label { color: #eaf6ff; }

        /* —— 双栏编辑器 —— */
        .text-area-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: stretch;
        }

        .text-box {
            flex: 1;
            min-width: 0;
        }

        .panel-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-bottom: 0.55rem;
            color: #c4d6ee;
            font-size: 0.78rem;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }
        .panel-label .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }
        .text-box.output .panel-label .dot {
            background: var(--secondary);
            box-shadow: 0 0 8px rgba(129, 140, 248, 0.5);
        }

        .editor-wrapper {
            display: flex;
            height: 340px;
            overflow: hidden;
            border-radius: var(--r-lg);
            border: 1px solid var(--card-border);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 12px 24px rgba(2, 8, 22, 0.25);
            position: relative;
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        .editor-wrapper:focus-within {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 12px 24px rgba(2, 8, 22, 0.25),
                0 0 0 3px var(--primary-soft);
        }

        .editor-wrapper.previewing {
            border-style: dashed;
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                0 12px 24px rgba(2, 8, 22, 0.25),
                0 0 0 2px rgba(34, 211, 238, 0.15);
        }

        .line-numbers {
            width: 50px;
            padding: 1rem 0.6rem 1rem 0;
            text-align: right;
            white-space: pre;
            user-select: none;
            overflow: hidden;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.65;
            color: #5d7187;
            background: var(--line-num-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        textarea {
            flex: 1;
            padding: 1rem 1.05rem;
            border: none;
            resize: none;
            outline: none;
            overflow: auto;
            white-space: pre;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.65;
            color: #e8f1ff;
            background: var(--editor-bg);
        }

        textarea::placeholder {
            color: #5d7187;
        }

        textarea::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        textarea::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: rgba(120, 150, 190, 0.4);
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 150, 190, 0.6);
            background-clip: padding-box;
        }

        textarea::-webkit-scrollbar-track {
            background: transparent;
        }

        .editor-meta {
            margin-top: 0.5rem;
            color: var(--text-dim);
            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .editor-meta strong {
            color: #cfe0f5;
            font-weight: 600;
        }

        /* —— 回传按钮 —— */
        .transfer-btn-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
        }

        .transfer-btn {
            width: 40px;
            height: 96px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            background: linear-gradient(180deg, rgba(56, 189, 248, 0.28), rgba(129, 140, 248, 0.22));
            color: #dff3ff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
            align-items: center;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, filter .2s ease;
            box-shadow: 0 8px 18px rgba(8, 60, 90, 0.3);
        }

        .transfer-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            border-color: var(--primary);
            box-shadow: 0 14px 24px rgba(14, 90, 130, 0.42);
        }

        .transfer-btn:active {
            transform: translateY(0) scale(0.97);
        }

        .transfer-btn i {
            font-size: 13px;
        }

        .transfer-btn::after {
            content: "回传";
            font-size: 10px;
            letter-spacing: 3px;
            writing-mode: vertical-lr;
            color: #cfe8ff;
        }

        /* —— 按钮组 —— */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            margin-bottom: 1.2rem;
            min-height: 44px;
        }

        button {
            font-family: inherit;
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.86rem;
            letter-spacing: 0.3px;
            padding: 0.68rem 1.25rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0) scale(0.97);
        }

        button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* 功能按钮：默认隐藏，输入后按需显示 */
        .fn-btn { display: none; }
        .fn-btn.active {
            display: inline-flex;
            animation: pop 220ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes pop {
            from { opacity: 0; transform: translateY(6px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 4 个功能按钮 · 青→蓝紫色相递进 */
        button#btn1.active { background: linear-gradient(120deg, #22d3ee, #06b6d4); box-shadow: 0 6px 16px rgba(34, 211, 238, 0.3); }
        button#btn2.active { background: linear-gradient(120deg, #38bdf8, #0ea5e9); box-shadow: 0 6px 16px rgba(56, 189, 248, 0.3); }
        button#btn3.active { background: linear-gradient(120deg, #60a5fa, #3b82f6); box-shadow: 0 6px 16px rgba(96, 165, 250, 0.3); }
        button#btn4.active { background: linear-gradient(120deg, #818cf8, #6366f1); box-shadow: 0 6px 16px rgba(129, 140, 248, 0.3); }

        /* 复制按钮 · 主操作，始终显示 */
        .copy-btn {
            display: inline-flex;
            background: linear-gradient(120deg, #34d3ee, #38bdf8 55%, #6366f1);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
            padding: 0.68rem 1.5rem;
        }

        .copy-btn:hover {
            box-shadow: 0 12px 26px rgba(56, 189, 248, 0.45);
        }

        /* —— 提示条 —— */
        .tip {
            text-align: center;
            color: var(--text-soft);
            padding: 0.85rem 1rem;
            border-radius: var(--r-md);
            border: 1px solid var(--card-border);
            background: rgba(8, 18, 34, 0.5);
            font-size: 0.84rem;
        }

        @media (max-width: 768px) {
            body { padding: 14px; }
            .container { padding: 1.1rem; border-radius: 18px; }
            .page-head { margin-bottom: 1.2rem; }
            .toolbar { gap: 0.45rem; margin-bottom: 1.1rem; }
            .chip { height: 34px; padding: 0 0.7rem; font-size: 0.8rem; }
            .chip .chip-label { font-size: 0.78rem; }

            .text-area-group { flex-direction: column; gap: 0.55rem; }
            .editor-wrapper { height: 220px; border-radius: 14px; }
            .line-numbers { width: 44px; font-size: 12px; }
            .editor-meta { font-size: 11px; margin-top: 0.35rem; }

            .transfer-btn-wrap { padding: 6px 0; }
            .transfer-btn {
                width: 100%;
                height: 40px;
                border-radius: 12px;
                flex-direction: row;
                gap: 0.5rem;
            }
            .transfer-btn i { transform: rotate(90deg); font-size: 12px; }
            .transfer-btn::after {
                content: "将结果回传到输入框";
                font-size: 12px;
                letter-spacing: 0;
                writing-mode: horizontal-tb;
            }

            .btn-group { gap: 0.5rem; margin-bottom: 1rem; }
            button { font-size: 12.5px; padding: 0.58rem 0.95rem; }
            .tip { font-size: 12.5px; }
        }

        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128, 140, 160, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(128, 140, 160, 0.5); }

        @media (prefers-reduced-motion: reduce) {
            .container, .fn-btn.active { animation: none; }
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
<div id="particles-js"></div>

<div class="container">
    <header class="page-head">
        <h1>文本批量加工处理</h1>
        <div class="sub">多行 · 逗号 · 引号 &nbsp;批量互转</div>
    </header>

    <div class="toolbar">
        <label class="chip">
            <span class="chip-label">引号</span>
            <select id="quoteType">
                <option value="single">单引号 (')</option>
                <option value="double">双引号 (")</option>
            </select>
        </label>
        <label class="chip">
            <span class="chip-label">排序</span>
            <select id="sortMode">
                <option value="none">不排序</option>
                <option value="asc">升序</option>
                <option value="desc">降序</option>
            </select>
        </label>
        <label class="chip check">
            <input type="checkbox" id="dedupeOption">
            <span class="chip-label">去重</span>
        </label>
    </div>

    <div class="text-area-group">
        <div class="text-box">
            <label class="panel-label"><span class="dot"></span>输入文本</label>
            <div class="editor-wrapper">
                <div class="line-numbers" id="inputLineNums">1</div>
                <textarea id="inputText" placeholder="请粘贴需要处理的文本..." spellcheck="false"></textarea>
            </div>
            <div class="editor-meta"><strong>输入统计</strong>：<span id="inputStats">1 行 · 0 字</span></div>
        </div>

        <div class="transfer-btn-wrap">
            <button class="transfer-btn" id="transferBtn" title="将结果回传到输入框" aria-label="将结果回传到输入框">
                <i class="fa fa-chevron-left"></i>
            </button>
        </div>

        <div class="text-box output">
            <label class="panel-label"><span class="dot"></span>输出结果</label>
            <div class="editor-wrapper">
                <div class="line-numbers" id="outputLineNums">1</div>
                <textarea id="outputText" placeholder="结果显示区域..." readonly spellcheck="false"></textarea>
            </div>
            <div class="editor-meta"><strong>输出统计</strong>：<span id="outputStats">1 行 · 0 字</span></div>
        </div>
    </div>

    <div class="btn-group">
        <button id="btn1" class="fn-btn">多行 → 逗号拼接</button>
        <button id="btn2" class="fn-btn">多行 → 引号逗号</button>
        <button id="btn3" class="fn-btn">逗号 → 多行</button>
        <button id="btn4" class="fn-btn">引号 → 无引多行</button>
        <button class="copy-btn" id="copyBtn"><i class="fa fa-copy"></i> 复制结果</button>
    </div>

    <div class="tip" id="tipInfo">温馨提示：输入文本后，自动显示功能按钮</div>
</div>

<script src="./vendor/particles.js/2.0.0/particles.min.js"></script>
<script>
    // --- 业务逻辑完全保留 ---
    particlesJS('particles-js', {
        "particles": {
            "number": {"value": 30},
            "color": {"value": "#ffffff"},
            "opacity": {"value": 0.2},
            "size": {"value": 2},
            "line_linked": {"enable": true, "distance": 150, "opacity": 0.1},
            "move": {"enable": true, "speed": 1}
        }
    });

    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const inputLineNums = document.getElementById('inputLineNums');
    const outputLineNums = document.getElementById('outputLineNums');
    const inputStats = document.getElementById('inputStats');
    const outputStats = document.getElementById('outputStats');
    const tipInfo = document.getElementById('tipInfo');
    const transferBtn = document.getElementById('transferBtn');
    const sortMode = document.getElementById('sortMode');
    const dedupeOption = document.getElementById('dedupeOption');
    let currentActionFn = (t) => t;

    let lastInputLines = 0;
    const getStatsText = (text) => {
        const lines = text ? text.split(/\r?\n/).length : 1;
        const chars = text.length;
        return `${lines} 行 · ${chars} 字`;
    };

    const updateStats = () => {
        inputStats.innerText = getStatsText(inputText.value);
        outputStats.innerText = getStatsText(outputText.value);
    };

    const updateLineNumbers = (ta, lineNumDiv) => {
        const lines = ta.value.split('\n').length;
        if (ta === inputText && lines === lastInputLines) return;
        if (ta === inputText) lastInputLines = lines;

        const nums = [];
        for (let i = 1; i <= lines; i++) {
            nums.push(i);
        }
        lineNumDiv.innerText = nums.join('\n');
    };

    const syncScroll = (ta, lineNumDiv) => {
        window.requestAnimationFrame(() => {
            lineNumDiv.scrollTop = ta.scrollTop;
        });
    };

    inputText.addEventListener('input', () => {
        updateLineNumbers(inputText, inputLineNums);
        updateStats();
        judgeInputTypeAndShowButtons();
    });

    inputText.addEventListener('scroll', () => syncScroll(inputText, inputLineNums));
    outputText.addEventListener('scroll', () => syncScroll(outputText, outputLineNums));

    const trimStr = (str) => str.replace(/^\s+|\s+$/g, '');

    // --- 预览功能 ---
    let savedOutputValue = '';
    let savedTipInfo = '';
    let isPreviewing = false;
    const PREVIEW_MAX_LINES = 10;
    const PREVIEW_MAX_CHARS = 500;

    const getPreviewInput = (text) => {
        const lines = text.split(/\r?\n/);
        if (lines.length <= PREVIEW_MAX_LINES && text.length <= PREVIEW_MAX_CHARS) {
            return { preview: text, truncated: false };
        }
        const previewLines = lines.slice(0, PREVIEW_MAX_LINES);
        let preview = previewLines.join('\n');
        if (preview.length > PREVIEW_MAX_CHARS) {
            preview = preview.substring(0, PREVIEW_MAX_CHARS);
        }
        return { preview, truncated: true };
    };

    const getActionFnForBtn = (btnId) => {
        switch(btnId) {
            case 'btn1': return batchProcessText.multiToSingle;
            case 'btn2': {
                const quote = document.getElementById('quoteType').value === 'single' ? "'" : '"';
                return (t) => batchProcessText.multiToSingleWithQuote(t, quote);
            }
            case 'btn3': return batchProcessText.singleToMulti;
            case 'btn4': return batchProcessText.singleQuotedToMultiUnquoted;
            default: return (t) => t;
        }
    };

    const showPreview = (btnId) => {
        const inputVal = trimStr(inputText.value);
        if (!inputVal) return;
        savedOutputValue = outputText.value;
        savedTipInfo = tipInfo.innerText;
        isPreviewing = true;

        const actionFn = getActionFnForBtn(btnId);
        const { preview, truncated } = getPreviewInput(inputText.value);
        const previewResult = applySelectedOptions(actionFn(preview));

        outputText.value = previewResult;
        outputText.closest('.editor-wrapper').classList.add('previewing');
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        tipInfo.innerText = truncated
            ? '⚡ 预览模式 — 仅使用前 10 行数据，点击按钮查看完整结果'
            : '⚡ 预览模式 — 点击按钮执行操作';
    };

    const hidePreview = () => {
        if (!isPreviewing) return;
        isPreviewing = false;
        outputText.value = savedOutputValue;
        outputText.closest('.editor-wrapper').classList.remove('previewing');
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        savedOutputValue = '';
        tipInfo.innerText = savedTipInfo;
    };

    // --- 执行操作 ---
    const copyToClipboard = async (text) => {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (e) {
            // 降级方案
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                document.body.removeChild(textarea);
                return true;
            } catch (err) {
                document.body.removeChild(textarea);
                return false;
            }
        }
    };

    const processAction = (actionFn = currentActionFn, autoCopy = false) => {
        if (isPreviewing) {
            isPreviewing = false;
            outputText.closest('.editor-wrapper').classList.remove('previewing');
        }
        currentActionFn = actionFn;
        const val = applySelectedOptions(currentActionFn(inputText.value));
        outputText.value = val;
        savedOutputValue = '';
        updateLineNumbers(outputText, outputLineNums);
        updateStats();
        outputText.scrollTop = 0;
        outputLineNums.scrollTop = 0;

        // 如果启用自动复制
        if (autoCopy && val) {
            copyToClipboard(val).then(success => {
                if (success) {
                    tipInfo.innerText = '已转换并复制到剪贴板！';
                } else {
                    tipInfo.innerText = '已转换，但自动复制失败';
                }
                setTimeout(() => {
                    tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
                }, 2000);
            });
        }
    };

    const batchProcessText = {
        multiToSingle: (text) => text.split(/\r?\n/).map(trimStr).filter(Boolean).join(','),
        multiToSingleWithQuote: (text, quote) => text.split(/\r?\n/).map(trimStr).filter(Boolean).map(s => `${quote}${s}${quote}`).join(','),
        singleToMulti: (text) => text.split(',').map(trimStr).filter(Boolean).join('\n'),
        singleQuotedToMultiUnquoted: (text) => text.replace(/["']/g, '').split(',').map(trimStr).filter(Boolean).join('\n'),
        sortText: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            return text
                .split(splitter)
                .map(trimStr)
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }))
                .join(hasLineBreak ? '\n' : ',');
        },
        sortTextDesc: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            return text
                .split(splitter)
                .map(trimStr)
                .filter(Boolean)
                .sort((a, b) => b.localeCompare(a, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }))
                .join(hasLineBreak ? '\n' : ',');
        },
        deduplicateText: (text) => {
            const hasLineBreak = text.includes('\n');
            const splitter = hasLineBreak ? /\r?\n/ : ',';
            const unique = Array.from(new Set(
                text.split(splitter).map(trimStr).filter(Boolean)
            ));
            return unique.join(hasLineBreak ? '\n' : ',');
        }
    };
    const applySelectedOptions = (text) => {
        let val = text;
        if (dedupeOption.checked) val = batchProcessText.deduplicateText(val);
        if (sortMode.value === 'asc') val = batchProcessText.sortText(val);
        if (sortMode.value === 'desc') val = batchProcessText.sortTextDesc(val);
        return val;
    };

    const judgeInputTypeAndShowButtons = () => {
        const inputVal = trimStr(inputText.value);
        const btns = ['btn1', 'btn2', 'btn3', 'btn4'];
        btns.forEach(id => document.getElementById(id).classList.remove('active'));

        if (!inputVal) {
            tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
            return;
        }

        if (inputVal.includes('\n')) {
            document.getElementById('btn1').classList.add('active');
            document.getElementById('btn2').classList.add('active');
        } else if (inputVal.includes(',')) {
            document.getElementById('btn3').classList.add('active');
            if (inputVal.includes('"') || inputVal.includes("'")) document.getElementById('btn4').classList.add('active');
        } else {
            btns.forEach(id => document.getElementById(id).classList.add('active'));
        }
    };

    document.getElementById('btn1').addEventListener('click', () => processAction(batchProcessText.multiToSingle, true));
    document.getElementById('btn2').addEventListener('click', () => {
        const quote = document.getElementById('quoteType').value === 'single' ? "'" : '"';
        processAction((t) => batchProcessText.multiToSingleWithQuote(t, quote), true);
    });
    document.getElementById('btn3').addEventListener('click', () => processAction(batchProcessText.singleToMulti, true));
    document.getElementById('btn4').addEventListener('click', () => processAction(batchProcessText.singleQuotedToMultiUnquoted, true));

    // 预览事件绑定
    ['btn1', 'btn2', 'btn3', 'btn4'].forEach(id => {
        const btn = document.getElementById(id);
        btn.addEventListener('mouseenter', () => showPreview(id));
        btn.addEventListener('mouseleave', hidePreview);
    });
    sortMode.addEventListener('change', () => processAction());
    dedupeOption.addEventListener('change', () => processAction());

    transferBtn.addEventListener('click', () => {
        if (!outputText.value) return;
        inputText.value = outputText.value;
        updateLineNumbers(inputText, inputLineNums);
        updateStats();
        judgeInputTypeAndShowButtons();
        tipInfo.innerText = '结果已回传';
        // 手机端自动滚回顶部
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
        if (!outputText.value) return;
        const success = await copyToClipboard(outputText.value);
        if (success) {
            tipInfo.innerText = '复制成功！';
            setTimeout(() => {
                // 只有在提示还是"复制成功"时才恢复，避免覆盖其他提示
                if (tipInfo.innerText === '复制成功！') {
                    tipInfo.innerText = '温馨提示：输入文本后，自动显示功能按钮';
                }
            }, 2000);
        }
    });

    updateLineNumbers(inputText, inputLineNums);
    updateLineNumbers(outputText, outputLineNums);
    judgeInputTypeAndShowButtons();
    updateStats();
</script>
<script src="scripts/form-persist.js"></script>
</body>
</html>
