<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron 表达式工具</title>
    <link rel="stylesheet" href="styles/workbench.css">
    <link rel="stylesheet" href="styles/cron.css">
</head>
<body class="cron-tool">
<main class="container">
    <header class="page-heading">
        <h1>Cron 表达式<span class="title-dot">.</span></h1>
        <p class="page-description">解析 5 段与 6 段表达式，计算最近 10 次运行时间</p>
    </header>

    <section class="workspace" aria-label="Cron 表达式工作区">
        <aside class="workspace-sidebar">
            <p class="sidebar-title">常用示例</p>
            <div class="examples-grid">
                <button class="example-item" type="button" data-cron="0 0 * * *">
                    <span class="example-expression">0 0 * * *</span>
                    <span class="example-description">每天 00:00（5 段）</span>
                </button>
                <button class="example-item" type="button" data-cron="*/15 * * * *">
                    <span class="example-expression">*/15 * * * *</span>
                    <span class="example-description">每 15 分钟（5 段）</span>
                </button>
                <button class="example-item" type="button" data-cron="0 9 * * MON-FRI">
                    <span class="example-expression">0 9 * * MON-FRI</span>
                    <span class="example-description">工作日 09:00（字母区间）</span>
                </button>
                <button class="example-item" type="button" data-cron="0 0 12 * * SUN">
                    <span class="example-expression">0 0 12 * * SUN</span>
                    <span class="example-description">每周日 12:00（字母，无歧义）</span>
                </button>
                <button class="example-item" type="button" data-cron="*/5 * * * * *">
                    <span class="example-expression">*/5 * * * * *</span>
                    <span class="example-description">每 5 秒（6 段）</span>
                </button>
                <button class="example-item" type="button" data-cron="0 0 12 * * *">
                    <span class="example-expression">0 0 12 * * *</span>
                    <span class="example-description">每天 12:00:00（6 段）</span>
                </button>
                <button class="example-item" type="button" data-cron="0 0 12 ? * MON-FRI">
                    <span class="example-expression">0 0 12 ? * MON-FRI</span>
                    <span class="example-description">工作日 12:00（Quartz 占位符 ?）</span>
                </button>
                <button class="example-item" type="button" data-cron="0 0 0 1 JAN ?">
                    <span class="example-expression">0 0 0 1 JAN ?</span>
                    <span class="example-description">每年 1 月 1 日（月份别名 JAN）</span>
                </button>
            </div>

            <div class="format-guide">
                <h2>格式说明</h2>
                <p><b>5 段</b>：分 时 日 月 周</p>
                <p><b>6 段</b>：秒 分 时 日 月 周</p>
                <p><b>字母别名</b>：<code>SUN</code>、<code>JAN</code> 等，各框架含义一致</p>
                <p><b>周字段</b>：按 <code>0=周日</code> 计算，纯数字写法在 Quartz 下含义不同</p>
            </div>
        </aside>

        <div class="tool-content">
            <div class="cron-input-panel">
                <div class="label">
                    <span><b>01</b> Cron 表达式</span>
                    <span class="panel-hint">5 段或 6 段</span>
                </div>
                <input type="text" id="cronInput" placeholder="输入 Cron 表达式，例如：0 12 * * * 或 */5 * * * * *" spellcheck="false">
                <div class="result-tip" id="resultTip">就绪</div>
            </div>

            <div class="cron-output-panel">
                <div class="label">
                    <span><b>02</b> 最近 10 次运行时间</span>
                </div>
                <div class="cron-hint" id="dayOfWeekHint" hidden></div>
                <div id="cronScheduleList" class="cron-schedule-list"></div>
            </div>
        </div>

        <div class="tool-controls">
            <button class="btn btn-success" id="calculateBtn">计算运行时间</button>
            <button class="btn btn-danger" id="clearBtn">清空</button>
            <button class="btn btn-secondary" id="copyBtn">复制表达式</button>
        </div>
    </section>
</main>

<script>
    /**
     * Cron 表达式解析和计算工具
     */
    const cronInput = document.getElementById('cronInput');
    const cronScheduleList = document.getElementById('cronScheduleList');
    const resultTip = document.getElementById('resultTip');
    const dayOfWeekHint = document.getElementById('dayOfWeekHint');
    const calculateBtn = document.getElementById('calculateBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    // 常用 Cron 示例
    const exampleItems = document.querySelectorAll('.example-item');
    exampleItems.forEach(item => {
        item.addEventListener('click', () => {
            const cronExpr = item.getAttribute('data-cron');
            cronInput.value = cronExpr;
            calculateSchedule(cronExpr);
        });
    });

    function showTip(message, isError = false) {
        resultTip.textContent = message;
        resultTip.style.color = isError ? 'var(--danger-color)' : 'var(--text-muted)';
        setTimeout(() => {
            if (!isError) resultTip.style.color = 'var(--text-muted)';
        }, 3000);
    }

    async function copyToClipboard(text, successMsg) {
        if (!text.trim()) {
            showTip('暂无内容可复制', true);
            return;
        }
        try {
            await navigator.clipboard.writeText(text);
            showTip(successMsg);
        } catch (error) {
            showTip(`复制失败：${error.message}`, true);
        }
    }

    // 解析 Cron 表达式并计算最近 10 次运行时间
    function calculateSchedule(cronExpr) {
        if (!cronExpr || !cronExpr.trim()) {
            showTip('请输入 Cron 表达式', true);
            return;
        }

        try {
            const schedule = parseCronExpression(cronExpr);
            const nextRuns = getNextRuns(schedule, 10);
            renderScheduleList(nextRuns);
            renderDayOfWeekHint(schedule);
            showTip('计算完成');
        } catch (error) {
            renderDayOfWeekHint(null);
            showTip(`解析失败：${error.message}`, true);
        }
    }

    // 周字段的字母别名：SUN/MON/... 在 Unix 与 Quartz 中含义一致，用它可消除框架歧义
    const DAY_OF_WEEK_ALIASES = {
        SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6
    };

    // 月份字段的字母别名（Unix 与 Quartz 通用）
    const MONTH_ALIASES = {
        JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6,
        JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12
    };

    // 归一化字段：把 Quartz 占位符 ? 视作 *，并把字母别名转成数字；无法识别的别名直接报错
    function normalizeCronField(field, aliases) {
        let result = field === '?' ? '*' : field;
        if (aliases) {
            result = result.replace(/[A-Za-z]+/g, name => {
                const value = aliases[name.toUpperCase()];
                if (value === undefined) {
                    throw new Error(`无法识别的字段别名：${name}`);
                }
                return String(value);
            });
        }
        return result;
    }

    // 简单的 Cron 表达式解析器（支持 5 段与 6 段）
    function parseCronExpression(expr) {
        const parts = expr.trim().split(/\s+/);
        if (parts.length !== 5 && parts.length !== 6) {
            throw new Error('Cron 表达式应为 5 个字段（分 时 日 月 周）或 6 个字段（秒 分 时 日 月 周）');
        }

        // 6 段时首位为「秒」，其余字段整体后移一位
        const hasSeconds = parts.length === 6;
        const offset = hasSeconds ? 1 : 0;
        const rawDayOfWeek = parts[offset + 4];

        return {
            second: hasSeconds ? parts[0] : '0',
            minute: parts[offset],
            hour: parts[offset + 1],
            dayOfMonth: normalizeCronField(parts[offset + 2]),
            month: normalizeCronField(parts[offset + 3], MONTH_ALIASES),
            dayOfWeek: normalizeCronField(rawDayOfWeek, DAY_OF_WEEK_ALIASES),
            // 6 段且「周」用数字时，Unix（0=周日）与 Quartz（1=周日）解释不同，需提示用户
            ambiguousDayOfWeek: hasSeconds && !/[A-Za-z]/.test(rawDayOfWeek) && /[0-9]/.test(rawDayOfWeek)
        };
    }

    // 计算下一次运行时间（简化版）
    function getNextRuns(schedule, count) {
        const runs = [];
        let current = new Date();
        
        for (let i = 0; i < count; i++) {
            current = getNextRunTime(schedule, current);
            runs.push(new Date(current));
        }
        
        return runs;
    }

    // 计算下一次运行时间（先按分钟定位匹配的日期时间，再在该分钟内寻找匹配的秒）
    function getNextRunTime(schedule, current) {
        const next = new Date(current);
        next.setMilliseconds(0);
        next.setSeconds(next.getSeconds() + 1); // 严格向后推进 1 秒

        let startSecond = next.getSeconds();

        while (true) {
            if (matchesWithoutSeconds(schedule, next)) {
                for (let second = startSecond; second < 60; second++) {
                    if (matchesField(schedule.second, second)) {
                        next.setSeconds(second);
                        return next;
                    }
                }
            }
            next.setMinutes(next.getMinutes() + 1);
            next.setSeconds(0);
            startSecond = 0;
            if (next.getTime() - current.getTime() > 365 * 24 * 60 * 60 * 1000) {
                throw new Error('无法在一年内找到匹配的运行时间');
            }
        }
    }

    // 检查日期（不含秒）是否匹配 Cron 表达式
    function matchesWithoutSeconds(schedule, date) {
        return (
            matchesField(schedule.minute, date.getMinutes()) &&
            matchesField(schedule.hour, date.getHours()) &&
            matchesField(schedule.dayOfMonth, date.getDate()) &&
            matchesField(schedule.month, date.getMonth() + 1) &&
            matchesField(schedule.dayOfWeek, date.getDay())
        );
    }

    // 检查单个字段是否匹配
    function matchesField(field, value) {
        if (field === '*') return true;
        if (field.includes('/')) {
            const [start, step] = field.split('/');
            const startVal = start === '*' ? 0 : parseInt(start);
            return (value - startVal) % parseInt(step) === 0;
        }
        if (field.includes(',')) {
            return field.split(',').some(f => parseInt(f) === value);
        }
        if (field.includes('-')) {
            const [min, max] = field.split('-');
            return value >= parseInt(min) && value <= parseInt(max);
        }
        return parseInt(field) === value;
    }

    // 渲染运行时间列表
    function renderScheduleList(runs) {
        if (!runs || runs.length === 0) {
            cronScheduleList.innerHTML = '';
            return;
        }

        let html = '';
        runs.forEach((run, index) => {
            const formattedTime = run.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            html += `
                <div class="schedule-item">
                    <div class="schedule-index">${index + 1}</div>
                    <div class="schedule-time">${formattedTime}</div>
                </div>
            `;
        });

        cronScheduleList.innerHTML = html;
    }

    // 「周」字段使用数字时的框架差异提示（Unix 0=周日 / Quartz 1=周日）
    function renderDayOfWeekHint(schedule) {
        if (!schedule || !schedule.ambiguousDayOfWeek) {
            dayOfWeekHint.hidden = true;
            dayOfWeekHint.textContent = '';
            return;
        }
        dayOfWeekHint.textContent = '⚠️ 「周」字段按 0=周日 计算（Unix / Spring 习惯）；Quartz 中 1=周日。若用于 Quartz，建议改用字母别名（SUN、MON…）以避免歧义。';
        dayOfWeekHint.hidden = false;
    }

    // 事件监听器
    calculateBtn.addEventListener('click', () => {
        const cronExpr = cronInput.value.trim();
        calculateSchedule(cronExpr);
    });

    clearBtn.addEventListener('click', () => {
        cronInput.value = '';
        cronScheduleList.innerHTML = '';
        renderDayOfWeekHint(null);
        showTip('已清空');
    });

    copyBtn.addEventListener('click', () => {
        const cronExpr = cronInput.value.trim();
        copyToClipboard(cronExpr, '表达式已复制');
    });

    // 输入时自动计算
    let calculateTimer = null;
    cronInput.addEventListener('input', function() {
        clearTimeout(calculateTimer);
        calculateTimer = setTimeout(() => {
            const cronExpr = this.value.trim();
            if (cronExpr) {
                calculateSchedule(cronExpr);
            }
        }, 400);
    });
</script>
<script src="scripts/form-persist.js"></script>
</body>
</html>
